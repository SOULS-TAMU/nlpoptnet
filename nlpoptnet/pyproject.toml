[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpoptnet"
version = "2.0.0"
description = "NLPOptNet frontend on shared OHAGI components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ohagi[flax,optax,plotting,export]>=1.0.0,<2.0.0", "purin>=1.0.1,<2.0.0"]

license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE"]
authors = [
    {name = "Bimol Nath Roy"},
    {name = "Rahul Golder"},
    {name = "MM Faruque Hasan"},
]
keywords = ["jax", "constrained-learning", "differentiable-optimization"]

[project.urls]
Homepage = "https://github.com/SOULS-TAMU/nlpoptnet"
Repository = "https://github.com/SOULS-TAMU/nlpoptnet"

[project.optional-dependencies]
dev = ["pytest>=8", "build", "ruff", "osqp", "absl-py", "flatbuffers"]
plotting = ["matplotlib>=3.8"]
export = ["absl-py", "flatbuffers"]
cuda12 = ["jax[cuda12]>=0.4.30"]

[tool.setuptools.packages.find]
where = ["src"]




[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["nlpoptnet"]

[tool.coverage.report]
show_missing = true
precision = 1
include_namespace_packages = true
fail_under = 90.1
