[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpoptnet"
version = "0.2.0"
description = "A JAX-based package for projected learning of parametric optimization problems"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Bimol Nath Roy", email = "bimolnathroy@tamu.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jax==0.4.30; python_version < '3.13'",
    "jaxlib==0.4.30; python_version < '3.13'",
    "numpy==1.26.4; python_version < '3.13'",
    "scipy==1.13.1; python_version < '3.13'",
    "jax==0.4.35; python_version >= '3.13'",
    "jaxlib==0.4.35; python_version >= '3.13'",
    "numpy==2.1.3; python_version >= '3.13'",
    "scipy==1.14.1; python_version >= '3.13'",
    "flax==0.8.5",
    "optax==0.2.4",
    "chex==0.1.90",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
