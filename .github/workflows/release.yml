name: PyPI release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: nlpoptnet-pypi-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify release version and development ancestry
        working-directory: nlpoptnet
        run: |
          python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; assert os.environ["GITHUB_REF_NAME"] == "v"+p["version"]'
          git merge-base --is-ancestor HEAD origin/development
      - run: python -m pip install build twine
      - run: python -m build nlpoptnet --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
  candidate:
    needs: build
    name: Candidate wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-24.04-arm
            python: '3.13'
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-distributions
          path: dist
      - run: python -m pip install --only-binary=":all:" pytest dist/*.whl
      - run: python -m pip check
      - run: python -m pytest -q nlpoptnet/tests/test_workflow.py
  publish:
    needs: [build, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nlpoptnet/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          print-hash: true
  installed:
    needs: publish
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install "nlpoptnet==${GITHUB_REF_NAME#v}" pytest
      - run: python -m pip check
      - run: python -m pytest -q nlpoptnet/tests/test_workflow.py
